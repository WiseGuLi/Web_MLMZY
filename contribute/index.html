<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>投稿 | GuLi 马列毛主义学习站</title>
    <meta name="description" content="向 GuLi 马列毛主义学习站投稿文章、电子书、文档、图片、视频等学习资源。投稿邮箱：wise_gulily@gmail.com，邮件标题请写“MLM网站投稿”。" />
    <style>
        :root {
            --paper: #faf9f5;
            --ink: #1d1b19;
            --muted: #68625b;
            --red: #9e1414;
            --red-dark: #7c0d0d;
            --line: #e2ddd2;
            --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        #nav-placeholder,
        #footer-placeholder {
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            padding: clamp(48px, 7vw, 76px) 2rem clamp(56px, 8vw, 88px);
        }

        .contribute {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-head {
            padding-bottom: 26px;
            border-bottom: 1px solid var(--line);
        }

        .page-kicker {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--red);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.16em;
            line-height: 1.5;
        }

        .page-kicker::before {
            content: "";
            width: 26px;
            height: 2px;
            flex-shrink: 0;
            background: var(--red);
        }

        h1 {
            margin-top: 10px;
            font-family: var(--serif);
            font-size: clamp(30px, 4.2vw, 38px);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.35;
        }

        .lead {
            max-width: 720px;
            margin-top: 14px;
            color: #4b463f;
            font-size: 17px;
            line-height: 1.9;
        }

        .section {
            margin-top: 38px;
        }

        h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.5;
        }

        h2::before {
            content: "";
            width: 4px;
            height: 20px;
            flex-shrink: 0;
            border-radius: 1px;
            background: var(--red);
        }

        p {
            color: #3d3934;
            font-size: 16px;
            line-height: 1.9;
        }

        .type-list {
            margin-top: 14px;
            border-top: 1px solid var(--line);
            list-style: none;
        }

        .type-list li {
            display: flex;
            align-items: baseline;
            gap: 18px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }

        .type-list strong {
            flex-shrink: 0;
            width: 108px;
            color: var(--ink);
            font-size: 16px;
            font-weight: 600;
        }

        .type-list span {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        .submit-card {
            margin-top: 16px;
            padding: 24px 26px;
            border: 1px solid var(--line);
            border-left: 3px solid var(--red);
            background: #f5f2eb;
        }

        .mail-label {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }

        .mail-link {
            display: inline-block;
            margin-top: 4px;
            color: var(--red);
            font-size: clamp(21px, 3vw, 26px);
            font-weight: 600;
            line-height: 1.5;
            text-decoration-color: rgba(158, 20, 20, 0.35);
            text-underline-offset: 4px;
            word-break: break-all;
        }

        .mail-link:hover {
            color: var(--red-dark);
            text-decoration-color: currentColor;
        }

        .subject {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 8px 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(158, 20, 20, 0.18);
        }

        .subject span {
            color: var(--muted);
            font-size: 14px;
        }

        .subject strong {
            color: var(--ink);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .hint {
            margin-top: 14px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;
        }

        @media (max-width: 640px) {
            .main-content {
                padding: 40px 1.25rem 56px;
            }

            .page-head {
                padding-bottom: 21px;
            }

            .lead {
                font-size: 16px;
            }

            .section {
                margin-top: 30px;
            }

            .type-list li {
                display: block;
            }

            .type-list strong {
                display: block;
                width: auto;
            }

            .type-list span {
                display: block;
                margin-top: 2px;
            }

            .submit-card {
                padding: 20px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- 顶栏占位 -->
    <div id="nav-placeholder"></div>

    <main class="main-content">
        <article class="contribute">
            <header class="page-head">
                <p class="page-kicker">投稿</p>
                <h1>欢迎向本站投稿</h1>
                <p class="lead">
                    本站长期接收与马克思列宁主义、毛泽东思想相关的学习资料，
                    包括文章、电子书、文档、图片、视频等各类资源。
                </p>
            </header>

            <section class="section" aria-labelledby="accepted">
                <h2 id="accepted">可以投稿什么</h2>
                <ul class="type-list">
                    <li>
                        <strong>文章</strong>
                        <span>理论文章、读书笔记、学习心得与资料整理</span>
                    </li>
                    <li>
                        <strong>电子书 / 文档</strong>
                        <span>经典著作、资料汇编、扫描件及其他文档</span>
                    </li>
                    <li>
                        <strong>图片 / 视频</strong>
                        <span>历史图片、讲座录像、纪录片等影像资料</span>
                    </li>
                </ul>
            </section>

            <section class="section" aria-labelledby="how-to-submit">
                <h2 id="how-to-submit">投稿方式</h2>
                <p>目前仅通过电子邮件接收投稿，请将资料发送至：</p>

                <div class="submit-card">
                    <p class="mail-label">投稿邮箱</p>
                    <a
                        class="mail-link"
                        href="mailto:wise_gulily@gmail.com?subject=MLM%E7%BD%91%E7%AB%99%E6%8A%95%E7%A8%BF"
                    >wise_gulily@gmail.com</a>

                    <div class="subject">
                        <span>邮件标题必须为：</span>
                        <strong>MLM网站投稿</strong>
                    </div>

                    <p class="hint">
                        请在邮件中简要说明资源名称与来源，并以附件或可访问的下载链接形式发送。
                    </p>
                </div>
            </section>
        </article>
    </main>

    <!-- 页脚占位 -->
    <div id="footer-placeholder"></div>

    <!-- 加载外部顶栏与页脚 -->
    <script>
        fetch('/components/nav.html?v=12')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('顶栏加载失败:', err);
            });

        fetch('/components/footer.html?v=6')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('页脚加载失败:', err);
            });
    </script>

    <script src="/components/nav.js?v=7"></script>
</body>
</html>
