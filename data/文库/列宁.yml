- title: "《国家与革命》"
  file: "文库/列宁/《国家与革命》.pdf"
  author: "列宁"
  featured: true
  description: "系统阐述马克思主义国家学说的经典之作。阐明国家的阶级本质，论证无产阶级必须打碎旧的国家机器，建立无产阶级专政，并分析了共产主义发展的两个阶段。"
  quote: "国家是阶级矛盾不可调和的产物和表现。"
- title: "《大难临头，出路何在？》"
  file: "文库/列宁/《大难临头，出路何在？》.html"
  author: "列宁"
  featured: false
  description: "列宁在十月革命前夕撰写，分析俄国面临的深重危机，提出消除灾难、挽救国家的根本出路在于实行工人监督和国有化，最终走向社会主义革命。"
  quote: "战争是铁面无情的，它斩钉截铁地提出问题：或是灭亡，或是在经济方面也赶上并且超过先进国家。"
- title: "《帝国主义是资本主义的最高阶段》"
  file: "文库/列宁/《帝国主义是资本主义的最高阶段》.html"
  author: "列宁"
  featured: false
  description: "马克思主义政治经济学经典。全面分析帝国主义的经济特征（垄断、金融资本、资本输出等），揭示其寄生性和腐朽性，提出帝国主义是无产阶级革命前夜的论断。"
  quote: "帝国主义是无产阶级社会革命的前夜。"
- title: "《第二国际的破产》"
  file: "文库/列宁/《第二国际的破产》.html"
  author: "列宁"
  featured: false
  description: "一战爆发后列宁撰写，分析第二国际多数领袖背叛无产阶级国际主义、倒向本国资产阶级的原因，指出机会主义是国际工人运动的主要危险。"
  quote: "机会主义不是偶然的现象，不是个别人物的罪孽、过错和叛变，而是整个历史时代的社会产物。"
- title: "《俄国资本主义的发展》"
  file: "文库/列宁/《俄国资本主义的发展》.pdf"
  author: "列宁"
  featured: false
  description: "列宁早期经济学巨著。运用大量地方自治局统计资料，论证俄国资本主义的发展，批判民粹派否认资本主义在俄国发展的错误观点，为俄国革命奠定了理论基础。"
  quote: "俄国资本主义的发展，也就是国内市场的发展。"
- title: "《共产主义运动中的\"左派\"幼稚病》"
  file: "文库/列宁/《共产主义运动中的\"左派\"幼稚病》.pdf"
  author: "列宁"
  featured: false
  description: "列宁总结俄国革命经验，分析国际共产主义运动中“左派”共产党人的错误（如拒绝妥协、反对议会斗争等），阐述马克思主义战略策略原则，强调必须把原则的坚定性与策略的灵活性结合起来。"
  quote: "只要千百万劳动者团结得像一个人一样，跟随本阶级的优秀人物前进，胜利也就有了保证。"
- title: "《进一步，退两步》"
  file: "文库/列宁/《进一步，退两步》.html"
  author: "列宁"
  featured: false
  description: "列宁批判孟什维克机会主义的重要著作。论述俄国社会民主工党第二次代表大会上的斗争，阐明无产阶级政党必须是有严密组织和严格纪律的先锋队，奠定了新型无产阶级政党的组织原则。"
  quote: "无产阶级在争取政权的斗争中，除了组织，没有别的武器。"
- title: "《卡尔·马克思》(传略和马克思主义概述)"
  file: "文库/列宁/《卡尔·马克思》(传略和马克思主义概述).html"
  author: "列宁"
  featured: false
  description: "列宁为百科全书撰写的马克思传略及马克思主义思想体系概述。简明扼要地介绍了马克思的生平，并分哲学、经济学、社会主义等部分系统阐述了马克思主义的三个来源和三个组成部分。"
  quote: "马克思的学说之所以万能，就是因为它正确。"
- title: "《列宁全集》(六十卷总目录)"
  file: "文库/列宁/《列宁全集》(六十卷总目录).html"
  author: "列宁"
  featured: false
  description: "六十卷本《列宁全集》的总目录，全面收录列宁的著作、书信、笔记等，系统展示了列宁主义的思想全貌和发展脉络，是研究列宁主义的重要文献索引。"
  quote: "我们应当说真话，因为这是我们的力量所在。"
- title: "《列宁选集》第一卷"
  file: "文库/列宁/《列宁选集》第一卷.pdf"
  author: "列宁"
  featured: false
  description: "收录1894至1907年著作，包括《怎么办？》《进一步，退两步》《社会民主党在民主革命中的两种策略》等，阐述建党和革命策略理论。"
  quote: "没有革命的理论，就不会有革命的运动。"
- title: "《列宁选集》第二卷"
  file: "文库/列宁/《列宁选集》第二卷.pdf"
  author: "列宁"
  featured: false
  description: "收录1908至1917年著作，包括《唯物主义和经验批判主义》《帝国主义是资本主义的最高阶段》《国家与革命》等，阐述哲学与帝国主义论。"
  quote: "马克思主义在理论上的胜利，逼得它的敌人装扮成马克思主义者，历史的辩证法就是如此。"
- title: "《列宁选集》第三卷"
  file: "文库/列宁/《列宁选集》第三卷.pdf"
  author: "列宁"
  featured: false
  description: "收录1917至1919年著作，包括《四月提纲》《国家与革命》《无产阶级革命和叛徒考茨基》等，阐述十月革命与无产阶级专政学说。"
  quote: "我们应当把全部注意力集中到下面这一点上：学会管理国家，学会经营。"
- title: "《列宁选集》第四卷"
  file: "文库/列宁/《列宁选集》第四卷.pdf"
  author: "列宁"
  featured: false
  description: "收录1919至1923年著作，涵盖《共产主义运动中的“左派”幼稚病》《论粮食税》《宁肯少些，但要好些》等，论述新经济政策与社会主义建设道路。"
  quote: "在实践中，我们应当把全部注意力集中在寻找社会主义建设的具体途径上。"
- title: "《论粮食税》"
  file: "文库/列宁/《论粮食税》.html"
  author: "列宁"
  featured: false
  description: "新经济政策初期列宁的重要著作。论述用粮食税代替余粮收集制的必要性，指出在小农国家向社会主义过渡必须利用国家资本主义，允许自由贸易，以恢复和发展国民经济。"
  quote: "粮食税，是从极度贫困、经济破坏和战争迫使我们所实行的特殊的‘战时共产主义’向正常的社会主义的产品交换过渡的一种形式。"
- title: "《论民族自决权》"
  file: "文库/列宁/《论民族自决权》.html"
  author: "列宁"
  featured: false
  description: "阐述马克思主义关于民族问题的纲领。论证民族自决权在帝国主义时代的意义，批判机会主义在民族问题上的错误，强调压迫民族的无产阶级必须承认被压迫民族的分离权。"
  quote: "压迫其他民族的民族是不能获得解放的。"
- title: "《马克思主义和修正主义》"
  file: "文库/列宁/《马克思主义和修正主义》.html"
  author: "列宁"
  featured: false
  description: "批判伯恩施坦修正主义的檄文。分析修正主义在哲学、政治经济学和政治方面的表现，揭示其阶级根源，强调必须坚决捍卫马克思主义的基本原则。"
  quote: "修正主义，或者说‘修正’马克思主义，是资产阶级思想影响在工人运动中的表现。"
- title: "《宁肯少些，但要好些》"
  file: "文库/列宁/《宁肯少些，但要好些》.html"
  author: "列宁"
  featured: false
  description: "列宁晚年重要文章。针对国家机关膨胀和官僚主义问题，主张精简机构、提高质量，强调必须改善国家机关，选拔优秀人才，为建设社会主义提供保障。"
  quote: "我们国家机关的情况，即使不令人厌恶，至少也非常可悲。"
- title: "《社会民主党在民主革命中的两种策略》"
  file: "文库/列宁/《社会民主党在民主革命中的两种策略》.pdf"
  author: "列宁"
  featured: false
  description: "系统阐述无产阶级在资产阶级民主革命中的策略路线。论证无产阶级必须掌握革命领导权，通过武装起义建立工农民主专政，并立即将民主革命转变为社会主义革命。"
  quote: "马克思主义教导无产者不要避开资产阶级革命，不要不关心资产阶级革命，不要把革命中的领导权让给资产阶级，相反地，要尽最大的努力参加革命。"
- title: "《四月提纲》(论无产阶级在这次革命中的任务)"
  file: "文库/列宁/《四月提纲》(论无产阶级在这次革命中的任务).pdf"
  author: "列宁"
  featured: false
  description: "列宁在1917年二月革命后提出的纲领性文献。明确指出革命必须从第一阶段向第二阶段过渡，提出“全部政权归苏维埃”的口号，为十月革命制定了具体路线。"
  quote: "目前俄国的特点是从革命的第一阶段过渡到革命的第二阶段，第一阶段由于无产阶级的觉悟和组织程度不够，政权落到了资产阶级手中，第二阶段则应当使政权转到无产阶级和贫苦农民手中。"
- title: "《唯物主义和经验批判主义》"
  file: "文库/列宁/《唯物主义和经验批判主义》.pdf"
  author: "列宁"
  featured: false
  description: "列宁阐述马克思主义认识论的哲学名著。批判马赫主义（经验批判主义）的唯心主义，论证物质第一性、意识第二性的基本原理，提出“生活、实践的观点，应该是认识论的首要的和基本的观点”。"
  quote: "物质是标志客观实在的哲学范畴，这种客观实在是人通过感觉感知的，它不依赖于我们的感觉而存在，为我们的感觉所复写、摄影、反映。"
- title: "《无产阶级革命的军事纲领》"
  file: "文库/列宁/《无产阶级革命的军事纲领》.html"
  author: "列宁"
  featured: false
  description: "列宁在第一次世界大战期间撰写，论述无产阶级革命与战争、和平的关系，提出“变帝国主义战争为国内战争”的口号，强调无产阶级必须掌握武装，准备进行反对资产阶级的国内战争。"
  quote: "谁要社会主义，谁就应当拥护无产阶级的国内战争。"
- title: "《无产阶级革命和叛徒考茨基》"
  file: "文库/列宁/《无产阶级革命和叛徒考茨基》.html"
  author: "列宁"
  featured: false
  description: "批判考茨基资产阶级民主主义的著作。阐述无产阶级专政的必然性，驳斥考茨基对苏维埃政权的攻击，强调暴力革命和无产阶级专政是马克思主义的核心。"
  quote: "只有承认阶级斗争、同时也承认无产阶级专政的人，才是马克思主义者。"
- title: "《怎么办？》"
  file: "文库/列宁/《怎么办？》.pdf"
  author: "列宁"
  featured: false
  description: "系统阐述新型无产阶级政党思想的重要著作。批判经济派的自发性理论，提出“没有革命的理论，就不会有革命的运动”，强调必须建立集中统一的无产阶级政党。"
  quote: "没有革命的理论，就不会有革命的运动。"
- title: "《哲学笔记》"
  file: "文库/列宁/《哲学笔记》.pdf"
  author: "列宁"
  featured: false
  description: "列宁研读黑格尔、费尔巴哈等哲学著作的摘要、批注和短文。深入探讨辩证法、认识论和逻辑学，提出了辩证法的十六要素，丰富和发展了马克思主义哲学。"
  quote: "辩证法也就是（黑格尔和）马克思主义的认识论：正是问题的这一‘方面’（这不是问题的一个‘方面’，而是问题的实质）普列汉诺夫没有注意到，至于其他的马克思主义者就更不用说了。"
