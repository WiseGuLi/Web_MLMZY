- title: "共产党宣言"
  file: "文库/马克思/《共产党宣言》.html"
  author: "马克思、恩格斯"
  featured: true
  description: "国际共产主义运动第一个纲领性文献，运用唯物史观分析阶级斗争，宣告“两个必然”，阐明无产阶级的历史使命与政党的性质，标志着马克思主义的诞生。"
  quote: "无产者在这个革命中失去的只是锁链。他们获得的将是整个世界。全世界无产者，联合起来！"
- title: "共产党宣言"
  file: "文库/马克思/《共产党宣言》.pdf"
  author: "马克思、恩格斯"
  featured: true
  description: "国际共产主义运动第一个纲领性文献，运用唯物史观分析阶级斗争，宣告“两个必然”，阐明无产阶级的历史使命与政党的性质，标志着马克思主义的诞生。"
  quote: "无产者在这个革命中失去的只是锁链。他们获得的将是整个世界。全世界无产者，联合起来！"
- title: "资本论 第一卷"
  file: "文库/马克思/《资本论》第一卷.pdf"
  author: "马克思"
  featured: true
  description: "副标题为“资本的生产过程”，从商品二因素与劳动二重性出发，揭示剩余价值的生产秘密，阐明资本积累的一般规律与“剥夺者被剥夺”的历史趋势。"
  quote: "资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。"
- title: "资本论 第二卷"
  file: "文库/马克思/《资本论》第二卷.pdf"
  author: "马克思"
  featured: true
  description: "副标题为“资本的流通过程”，考察单个资本的循环周转与社会总资本的再生产，揭示资本运动的形式与条件，是剩余价值实现论的核心卷次。"
  quote: "资本不是一种物，而是一种以物为中介的人和人之间的社会关系。（《资本论》第一卷）"
- title: "资本论 第三卷"
  file: "文库/马克思/《资本论》第三卷.pdf"
  author: "马克思"
  featured: true
  description: "副标题为“资本主义生产的总过程”，分析剩余价值转化为利润、利润平均化及地租等具体形式，完成对资本主义生产方式总体运行的理论叙述。"
  quote: "资本来到世间，从头到脚，每个毛孔都滴着血和肮脏的东西。（《资本论》第一卷）"
- title: "德意志意识形态（节选）"
  file: "文库/马克思/《德意志意识形态》(节选).html"
  author: "马克思、恩格斯"
  featured: false
  description: "马克思主义哲学成熟的标志，首次系统阐述唯物史观，以“现实的个人”为逻辑起点，揭示社会存在决定社会意识，阐明共产主义是改变现存状况的现实运动。"
  quote: "对实践的唯物主义者即共产主义者来说，全部的问题都在于使现存世界革命化，实际地反对并改变现存的事物。"
- title: "法兰西内战"
  file: "文库/马克思/《法兰西内战》.html"
  author: "马克思"
  featured: false
  description: "总结巴黎公社72天实践经验，揭示无产阶级不能简单掌握现成国家机器，必须以公社式政权代替旧国家，是科学社会主义国家学说的重要发展。"
  quote: "工人阶级不能简单地掌握现成的国家机器，并运用它来达到自己的目的。"
- title: "哥达纲领批判"
  file: "文库/马克思/《哥达纲领批判》.html"
  author: "马克思"
  featured: false
  description: "批判拉萨尔派机会主义纲领，阐明共产主义两阶段与按劳分配原则，提出“各尽所能，按需分配”的共产主义高级阶段特征，丰富科学社会主义学说。"
  quote: "一步实际运动比一打纲领更重要。"
- title: "工资、价格和利润"
  file: "文库/马克思/《工资、价格和利润》.html"
  author: "马克思"
  featured: false
  description: "以通俗方式阐述劳动价值论与剩余价值理论的基本要点，说明工资与利润的对立，号召工人摒弃“公平工资”的保守格言，转向消灭雇佣劳动制度。"
  quote: "他们应当摒弃“做一天公平的工作，得一天公平的工资”这种保守的格言，要在自己的旗帜上写上革命的口号：“消灭雇佣劳动制度！”"
- title: "雇佣劳动与资本"
  file: "文库/马克思/《雇佣劳动与资本》.pdf"
  author: "马克思"
  featured: false
  description: "以1847年演讲为基础，阐明工资是劳动力价格、资本是积累起来的他人劳动，揭示资本利益与雇佣劳动利益的根本对立。"
  quote: "工资和利润是互成反比的。资本的份额即利润越增加，则劳动的份额即日工资就越降低。"
- title: "路易·波拿巴的雾月十八日"
  file: "文库/马克思/《路易·波拿巴的雾月十八日》.html"
  author: "马克思"
  featured: false
  description: "分析1848—1851年法国阶级斗争与政变，提出无产阶级必须打碎旧国家机器，阐明个人与历史、社会意识与社会存在的关系，是阶级分析方法的典范之作。"
  quote: "人们自己创造自己的历史，但是他们并不是随心所欲地创造，并不是在他们自己选定的条件下创造，而是在直接碰到的、既定的、从过去承继下来的条件下创造。"
- title: "马克思恩格斯论中国"
  file: "文库/马克思/《马克思恩格斯论中国》.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "汇编马克思、恩格斯关于中国问题的专题论述，分析西方列强侵略对中国社会结构的冲击，揭示资本主义世界市场与东方传统社会的碰撞。"
  quote: "资产阶级，由于一切生产工具的迅速改进，由于交通的极其便利，把一切民族甚至最野蛮的民族都卷到文明中来了。"
- title: "马克思恩格斯全集（五十卷总目录）"
  file: "文库/马克思/《马克思恩格斯全集》(五十卷总目录).html"
  author: "马克思、恩格斯"
  featured: false
  description: "五十卷本全集的总目录，涵盖著作卷、资本论及手稿卷、书信卷与笔记卷，系统呈现马克思主义理论体系的整体结构与文献全貌。"
  quote: "哲学家们只是用不同的方式解释世界，而问题在于改变世界。"
- title: "马克思恩格斯选集 第一卷"
  file: "文库/马克思/《马克思恩格斯选集》第一卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录1843—1859年早期著作，涵盖哲学批判与唯物史观奠基文献，包括《德意志意识形态》《共产党宣言》等标志性文本。"
  quote: "手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。"
- title: "马克思恩格斯选集 第二卷"
  file: "文库/马克思/《马克思恩格斯选集》第二卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录1857—1871年著作及《资本论》节选，涵盖政治经济学核心文献，集中呈现剩余价值学说与资本主义生产方式的内在矛盾。"
  quote: "资本主义生产方式占统治地位的社会的财富，表现为“庞大的商品堆积”，单个的商品表现为这种财富的元素形式。"
- title: "马克思恩格斯选集 第三卷"
  file: "文库/马克思/《马克思恩格斯选集》第三卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录1864—1883年著作，包括《法兰西内战》《哥达纲领批判》及《社会主义从空想到科学的发展》，汇集科学社会主义与国家学说的核心文本。"
  quote: "一切社会变迁和政治变革的终极原因，不应当到人们的头脑中……而应当到生产方式和交换方式的变更中去寻找。"
- title: "马克思恩格斯选集 第四卷"
  file: "文库/马克思/《马克思恩格斯选集》第四卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录恩格斯晚年著作及马克思、恩格斯书信选编，涉及家庭、私有制、国家起源与自然辩证法，书信部分具有重大理论价值。"
  quote: "劳动不是一切财富的泉源。自然界和劳动一样也是使用价值（而物质财富本来就是由使用价值构成的！）的泉源。"
- title: "青年在选择职业时的考虑"
  file: "文库/马克思/《青年在选择职业时的考虑》.html"
  author: "马克思"
  featured: false
  description: "马克思中学毕业时的德语作文，以崇高语调讨论职业选择的价值尺度，主张选择最能为人类而工作的职业，展现青年马克思的志向与人文关怀。"
  quote: "如果我们选择了最能为人类而工作的职业，那么，重担就不能把我们压倒，因为这是为大家作出的牺牲。"
- title: "神圣家族（与恩格斯合著）"
  file: "文库/马克思/《神圣家族》(与恩格斯合著).pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "批判青年黑格尔派“批判的批判”的思辨唯心主义，强调历史由现实的、活生生的人创造，提出“思想”不能离开“利益”，是唯物史观形成中的重要一步。"
  quote: "“思想”一旦离开“利益”，就一定会使自己出丑。"
- title: "哲学的贫困"
  file: "文库/马克思/《哲学的贫困》.pdf"
  author: "马克思"
  featured: false
  description: "批判蒲鲁东《贫困的哲学》的经济学形而上学，把唯物史观运用于政治经济学批判，阐明经济范畴的历史性，提出“手推磨”与“蒸汽磨”的著名论断。"
  quote: "手推磨产生的是封建主的社会，蒸汽磨产生的是工业资本家的社会。"
- title: "《〈黑格尔法哲学批判〉导言》"
  file: "文库/马克思/《〈黑格尔法哲学批判〉导言》.pdf"
  author: "马克思"
  featured: false
  description: "马克思早期重要著作，提出“宗教是人民的鸦片”，论述实现人的解放的关键在于无产阶级，将哲学批判与现实的革命实践结合起来，标志着马克思向唯物主义和共产主义的转变。"
  quote: "批判的武器当然不能代替武器的批判，物质力量只能用物质力量来摧毁；但是理论一经掌握群众，也会变成物质力量。"
- title: "《〈政治经济学批判〉序言》"
  file: "文库/马克思/《〈政治经济学批判〉序言》.pdf"
  author: "马克思"
  featured: false
  description: "唯物史观的经典表述。马克思回顾研究历程，精辟概括生产力与生产关系、经济基础与上层建筑的矛盾运动规律，提出“两个决不会”的著名论断。"
  quote: "无论哪一个社会形态，在它所能容纳的全部生产力发挥出来以前，是决不会灭亡的；而新的更高的生产关系，在它的物质存在条件在旧社会的胎胞里成熟以前，是决不会出现的。"
- title: "《1844年经济学哲学手稿》"
  file: "文库/马克思/《1844年经济学哲学手稿》.html"
  author: "马克思"
  featured: false
  description: "马克思早期未完成手稿。批判资产阶级政治经济学和黑格尔哲学，提出异化劳动理论，探讨共产主义与人的解放，蕴含丰富的经济学与哲学思想。"
  quote: "共产主义是私有财产即人的自我异化的积极的扬弃，因而是通过人并且为了人而对人的本质的真正占有。"
- title: "《1848年至1850年的法兰西阶级斗争》"
  file: "文库/马克思/《1848年至1850年的法兰西阶级斗争》.pdf"
  author: "马克思"
  featured: false
  description: "运用唯物史观分析法国1848年革命。总结革命经验，首次明确提出“无产阶级专政”概念，论述工农联盟的重要性，深化了无产阶级革命理论。"
  quote: "这种社会主义就是宣布不断革命，就是无产阶级的阶级专政，这种专政是达到消灭一切阶级差别，达到消灭这些差别所由产生的一切生产关系，达到消灭和这些生产关系相适应的一切社会关系，达到改变由这些社会关系产生出来的一切观念的必然的过渡阶段。"
