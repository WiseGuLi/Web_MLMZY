- title: "共产党宣言"
  file: "文库/恩格斯/《共产党宣言》.html"
  author: "马克思、恩格斯"
  featured: true
  description: "马克思与恩格斯合著的国际共产主义运动第一个纲领性文献，系统阐述科学社会主义基本原理，宣告共产党人的目的和意图。"
  quote: "无产者在这个革命中失去的只是锁链。他们获得的将是整个世界。"
- title: "共产党宣言"
  file: "文库/恩格斯/《共产党宣言》.pdf"
  author: "马克思、恩格斯"
  featured: true
  description: "马克思与恩格斯合著的国际共产主义运动第一个纲领性文献，系统阐述科学社会主义基本原理，宣告共产党人的目的和意图。"
  quote: "无产者在这个革命中失去的只是锁链。他们获得的将是整个世界。"
- title: "德意志意识形态（节选）"
  file: "文库/恩格斯/《德意志意识形态》(节选).html"
  author: "马克思、恩格斯"
  featured: false
  description: "马克思与恩格斯合著，系统阐述唯物史观，论证共产主义的历史必然性，标志着马克思主义哲学的形成。"
  quote: "统治阶级的思想在每一时代都是占统治地位的思想。"
- title: "法德农民问题"
  file: "文库/恩格斯/《法德农民问题》.html"
  author: "恩格斯"
  featured: false
  description: "恩格斯晚年阐述农业社会主义改造的重要著作，分析农民阶级各阶层的经济地位，提出无产阶级政党对待农民的基本原则。"
  quote: "当我们掌握了国家政权的时候，我们绝不会考虑用暴力去剥夺小农。"
- title: "反杜林论"
  file: "文库/恩格斯/《反杜林论》.pdf"
  author: "恩格斯"
  featured: false
  description: "全面批判杜林主义，系统阐述马克思主义哲学、政治经济学和科学社会主义，被誉为马克思主义的百科全书。"
  quote: "运动是物质的存在方式。无论何时何地，都没有也不可能有没有运动的物质。"
- title: "共产主义原理"
  file: "文库/恩格斯/《共产主义原理》.html"
  author: "恩格斯"
  featured: false
  description: "恩格斯以问答形式起草的共产主义者同盟纲领草案，通俗阐述什么是共产主义、无产阶级革命进程等基本问题。"
  quote: "共产主义革命将不仅是一个国家的革命，而将在一切文明国家里，即至少在英国、美国、法国、德国同时发生。"
- title: "国民经济学批判大纲"
  file: "文库/恩格斯/《国民经济学批判大纲》.pdf"
  author: "恩格斯"
  featured: false
  description: "恩格斯早期政治经济学批判代表作，被马克思称为“批判经济学范畴的天才大纲”，探讨私有制与商业危机等核心问题。"
  quote: "商业危机像彗星一样有规律地反复出现，在我们这里现在是平均每五年到七年发生一次。"
- title: "家庭、私有制和国家的起源"
  file: "文库/恩格斯/《家庭、私有制和国家的起源》.pdf"
  author: "恩格斯"
  featured: false
  description: "运用唯物史观研究古代社会的重要著作。阐明家庭、私有制和国家产生及发展过程，揭示国家本质及其消亡的历史必然性。"
  quote: "国家决不是从外部强加于社会的一种力量……它是社会在一定发展阶段上的产物。"
- title: "路德维希·费尔巴哈和德国古典哲学的终结"
  file: "文库/恩格斯/《路德维希·费尔巴哈和德国古典哲学的终结》.pdf"
  author: "恩格斯"
  featured: false
  description: "系统阐述马克思主义哲学与德国古典哲学关系的经典著作，明确提出哲学基本问题，批判唯心主义和不可知论。"
  quote: "全部哲学，特别是近代哲学的重大的基本问题，是思维和存在的关系问题。"
- title: "马克思恩格斯论中国"
  file: "文库/恩格斯/《马克思恩格斯论中国》.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "汇编马克思恩格斯关于中国问题的文章，分析西方列强侵略对中国社会的破坏，预言中国必将走向伟大的民族复兴。"
  quote: "过不了多少年，我们就会亲眼看到世界上最古老的帝国的垂死挣扎，看到整个亚洲新纪元的曙光。"
- title: "马克思恩格斯全集（五十卷总目录）"
  file: "文库/恩格斯/《马克思恩格斯全集》(五十卷总目录).html"
  author: "马克思、恩格斯"
  featured: false
  description: "五十卷本全集的总目录，涵盖著作、资本论及手稿、书信、笔记四部分，呈现马克思主义经典作家的整体文献结构。"
  quote: "我们在劳动发展史中找到了理解全部社会史的锁钥。"
- title: "马克思恩格斯选集 第一卷"
  file: "文库/恩格斯/《马克思恩格斯选集》第一卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录1843—1859年著作，包括《黑格尔法哲学批判》《1844年手稿》《共产党宣言》等，展现了马克思主义的创立过程。"
  quote: "哲学家们只是用不同的方式解释世界，而问题在于改变世界。"
- title: "马克思恩格斯选集 第二卷"
  file: "文库/恩格斯/《马克思恩格斯选集》第二卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录1857—1871年著作及《资本论》节选，涵盖《政治经济学批判》序言、《法兰西内战》等政治经济学与革命史核心文献。"
  quote: "无论哪一个社会形态，在它所能容纳的全部生产力发挥出来以前，是决不会灭亡的。"
- title: "马克思恩格斯选集 第三卷"
  file: "文库/恩格斯/《马克思恩格斯选集》第三卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录1864—1883年著作，包括《哥达纲领批判》《反杜林论》《社会主义从空想到科学的发展》等，系统论述科学社会主义。"
  quote: "国家不是“被废除”的，它是自行消亡的。"
- title: "马克思恩格斯选集 第四卷"
  file: "文库/恩格斯/《马克思恩格斯选集》第四卷.pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "收录恩格斯晚年著作及马恩书信选编，涵盖《家庭、私有制和国家的起源》《自然辩证法》及大量哲学、历史学通信。"
  quote: "劳动创造了人本身。"
- title: "社会主义从空想到科学的发展"
  file: "文库/恩格斯/《社会主义从空想到科学的发展》.pdf"
  author: "恩格斯"
  featured: false
  description: "恩格斯将《反杜林论》部分内容改编而成的通俗著作，阐述社会主义思想发展史，论证社会主义代替资本主义的必然性。"
  quote: "社会主义现在已经不再被看作某个天才头脑的偶然发现，而被看作两个历史地产生的阶级即无产阶级和资产阶级之间斗争的必然产物。"
- title: "神圣家族（与马克思合著）"
  file: "文库/恩格斯/《神圣家族》(与马克思合著).pdf"
  author: "马克思、恩格斯"
  featured: false
  description: "马克思与恩格斯合著的首部著作，批判青年黑格尔派的思辨唯心主义，初步阐述物质生产在历史发展中的决定作用。"
  quote: "历史活动是群众的事业，随着历史活动的深入，必将是群众队伍的扩大。"
- title: "英国工人阶级状况"
  file: "文库/恩格斯/《英国工人阶级状况》.pdf"
  author: "恩格斯"
  featured: false
  description: "恩格斯早期社会调查名著。通过实地考察英国工业中心，揭露资产阶级剥削，揭示无产阶级的悲惨境地与历史使命。"
  quote: "这些工人，这些被剥夺了一切生活资料的工人，除了自己本身的力量以外，没有任何别的力量。"
- title: "在马克思墓前的讲话"
  file: "文库/恩格斯/《在马克思墓前的讲话》.html"
  author: "恩格斯"
  featured: false
  description: "恩格斯在马克思葬礼上的悼词。高度评价马克思创立唯物史观和剩余价值学说两大贡献，颂扬其为人类解放奋斗的一生。"
  quote: "他可能有过许多敌人，但未必有一个私敌。"
- title: "自然辩证法"
  file: "文库/恩格斯/《自然辩证法》.pdf"
  author: "恩格斯"
  featured: false
  description: "恩格斯未完成的手稿，运用唯物辩证法总结19世纪自然科学成果，揭示自然界发展的客观规律，批判自然科学中的形而上学。"
  quote: "自然界是检验辩证法的试金石。"
