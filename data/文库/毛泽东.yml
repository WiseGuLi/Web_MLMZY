  quote: "外因是变化的条件，内因是变化的根据。"
- title: "《矛盾论》"
  file: "文库/毛泽东/《矛盾论》.html"
  author: "毛泽东"
  featured: false
  description: "毛泽东最重要的哲学著作之一。系统阐述唯物辩证法的核心——对立统一规律，批判教条主义，提出主要矛盾和矛盾主要方面等概念。"
  quote: "事物发展的根本原因，不是在事物的外部而是在事物的内部，在于事物内部的矛盾性。"
- title: "《实践论》"
  file: "文库/毛泽东/《实践论》.html"
  author: "毛泽东"
  featured: false
  description: "毛泽东重要哲学著作。以马克思主义认识论批判经验主义和教条主义，强调实践是认识的来源、动力、检验标准和目的，阐述认识发展的两次飞跃。"
  quote: "实践、认识、再实践、再认识，这种形式，循环往复以至无穷。"
- title: "《新民主主义论》"
  file: "文库/毛泽东/《新民主主义论》.html"
  author: "毛泽东"
  featured: false
  description: "毛泽东系统阐述新民主主义革命理论的著作，明确革命的性质、对象、动力、领导力量与前途，标志着新民主主义理论的成熟。"
  quote: "新民主主义的革命，是无产阶级领导的、人民大众的、反对帝国主义、封建主义和官僚资本主义的革命。"
