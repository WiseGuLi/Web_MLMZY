<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 · GuLi 马列毛主义学习站</title>
    <style>
        /* 重置所有边距，保证页面完全空白 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #faf9f5;  /* 与全站一致的浅暖灰底色 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶栏容器只负责占位，样式完全由 nav.html 决定 */
        #nav-placeholder {
            flex-shrink: 0;
        }

        /* 页脚占位 */
        #footer-placeholder {
            flex-shrink: 0;
        }

        /* 主体内容区域：完全空白，不显示任何内容 */
        .main-content {
            flex: 1;
            /* 不加任何内边距、边框、文字，保持全空 */
        }
    </style>
</head>
<body>

    <!-- 顶栏占位 -->
    <div id="nav-placeholder"></div>

    <!-- 主体：完全空白（不加任何文字或元素） -->
    <div class="main-content"></div>

    <!-- 页脚占位 -->
    <div id="footer-placeholder"></div>

    <!-- 加载外部顶栏与页脚 -->
    <script>
        fetch('/components/nav.html?v=4')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('顶栏加载失败:', err);
            });

        fetch('/components/footer.html?v=4')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('页脚加载失败:', err);
            });
    </script>

    <script src="/components/nav.js?v=3"></script>
</body>
</html>
