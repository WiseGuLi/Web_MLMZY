<style>
    /* 让占位容器不形成独立的盒子，顶栏才能真正跨整页吸顶 */
    #nav-placeholder {
        display: contents;
    }

    /* ===== 只针对顶部栏的样式，不影响页面其他部分 ===== */
    .top-bar,
    .top-bar * {
        box-sizing: border-box;
    }

    /* 全站文字选中后的浅红底色，与首页保持一致 */
    ::selection {
        background: #f0d6d3;
        color: #1d1b19;
    }

    ::-moz-selection {
        background: #f0d6d3;
        color: #1d1b19;
    }

    .top-bar {
        position: sticky;
        top: 0;
        z-index: 1000;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 0 2rem;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-user-select: none;
        user-select: none;
    }

    html[data-nav-position="bottom"] .top-bar {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        border-bottom: 0;
        box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
        animation: nav-rise 0.28s ease both;
    }

    html[data-nav-position="bottom"] body {
        padding-bottom: 64px;
    }

    html[data-nav-position="bottom"] .site-back-to-top {
        bottom: 92px;
    }

    @keyframes nav-rise {
        from {
            transform: translateY(100%);
        }

        to {
            transform: translateY(0);
        }
    }

    .site-title {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .star {
        font-size: 26px;
        line-height: 1;
        color: #e60000;
        transition: all 0.25s ease;
        display: inline-block;
    }

    .site-title:hover .star {
        transform: scale(1.35) rotate(25deg);
        color: #ffd700;
    }

    .title-text {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        white-space: nowrap;
    }
    .title-text .li {
        color: #cc0000;
    }

    /* ===== 桌面端：横向导航 ===== */
    .nav-links {
        display: flex;
        align-items: center;
        gap: 4px;
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-links a {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        border-radius: 8px;
        text-decoration: none;
        color: #222;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.4;
        transition: background 0.15s, color 0.15s;
        white-space: nowrap;
    }

    .nav-links a:hover {
        background: rgba(255, 0, 0, 0.08);
        color: #cc0000;
    }

    .nav-links a:hover img {
        filter: invert(27%) sepia(51%) saturate(2878%) hue-rotate(346deg) brightness(104%) contrast(97%);
    }

    .nav-links a img {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        object-fit: contain;
        object-position: center;
        transition: filter 0.15s;
    }

    .nav-links .nav-art-icon {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        background-color: currentColor;
        -webkit-mask: url('/icons/顶栏/资源/文艺.svg?v=1') no-repeat center / contain;
        mask: url('/icons/顶栏/资源/文艺.svg?v=1') no-repeat center / contain;
        transition: background-color 0.15s;
    }

    .nav-links .label {
        display: inline-block;
    }

    /* ===== “更多”下拉菜单（桌面端） ===== */
    .nav-more {
        position: relative;
    }

    .nav-more details {
        margin: 0;
    }

    .nav-more summary {
        position: relative;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        border-radius: 8px;
        color: #222;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.4;
        cursor: pointer;
        white-space: nowrap;
        list-style: none;
        transition: background 0.15s, color 0.15s;
    }

    .nav-more summary img {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        object-fit: contain;
        object-position: center;
        transition: filter 0.15s;
    }

    .nav-more summary:hover img {
        filter: invert(27%) sepia(51%) saturate(2878%) hue-rotate(346deg) brightness(104%) contrast(97%);
    }

    .nav-more summary::-webkit-details-marker {
        display: none;
    }

    .nav-more summary::marker {
        content: '';
    }

    .nav-more summary:hover,
    .nav-more details[open] > summary {
        background: rgba(255, 0, 0, 0.08);
        color: #cc0000;
    }

    .nav-more .caret {
        width: 8px;
        height: 8px;
        margin: -4px 0 0;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg);
        transition: transform 0.2s ease, margin 0.2s ease;
        flex-shrink: 0;
    }

    .nav-more details[open] .caret {
        margin-top: 2px;
        transform: rotate(225deg);
    }

    .nav-more .nav-sub {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 1001;
        min-width: 180px;
        margin: 0;
        padding: 6px;
        list-style: none;
        background: #fffefb;
        border: 1px solid #e2ddd2;
        border-radius: 6px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
    }

    .nav-sub a {
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        text-decoration: none;
    }

    .nav-sub a img {
        width: 18px;
        height: 18px;
        object-fit: contain;
        object-position: center;
    }

    .nav-sub .nav-sub-link {
        display: flex;
        align-items: center;
        gap: 5px;
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border-radius: 4px;
        color: #222;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        white-space: nowrap;
        cursor: default;
    }

    .nav-sub a.nav-sub-link {
        color: #222;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-sub a.nav-sub-link:hover,
    .nav-sub a.nav-sub-link:focus-visible {
        background: rgba(158, 20, 20, 0.07);
        color: #9e1414;
        outline: none;
    }

    /* 革命文艺与其他顶栏入口保持同一套普通样式 */
    .nav-sub a.nav-art {
        color: #222;
    }

    .nav-sub a.nav-art .nav-art-icon {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        background-color: currentColor;
        -webkit-mask: url('/icons/顶栏/资源/文艺.svg?v=1') no-repeat center / contain;
        mask: url('/icons/顶栏/资源/文艺.svg?v=1') no-repeat center / contain;
        transition: background-color 0.15s ease;
    }

    .nav-sub a.nav-art:hover,
    .nav-sub a.nav-art:focus-visible {
        background: rgba(255, 0, 0, 0.06);
        color: #cc0000;
        outline: none;
    }

    .nav-sub a.nav-art:hover .nav-art-icon,
    .nav-sub a.nav-art:focus-visible .nav-art-icon {
        background-color: #cc0000;
    }

    /* 视频入口与革命文艺保持同一套普通样式 */
    .nav-sub a.nav-video {
        color: #222;
    }

    .nav-sub a.nav-video .nav-video-icon {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        background-color: currentColor;
        -webkit-mask: url('/icons/顶栏/资源/视频.svg?v=1') no-repeat center / contain;
        mask: url('/icons/顶栏/资源/视频.svg?v=1') no-repeat center / contain;
        transition: background-color 0.15s ease;
    }

    .nav-sub a.nav-video:hover,
    .nav-sub a.nav-video:focus-visible {
        background: rgba(255, 0, 0, 0.06);
        color: #cc0000;
        outline: none;
    }

    .nav-sub a.nav-video:hover .nav-video-icon,
    .nav-sub a.nav-video:focus-visible .nav-video-icon {
        background-color: #cc0000;
    }

    .nav-sub .nav-sub-link img {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        object-fit: contain;
        object-position: center;
        opacity: 1;
    }

    /* 外观下拉在宽屏和窄屏使用同一宽度 */
    .nav-sub.nav-appearance-menu {
        width: 200px;
    }

    .nav-sub a.nav-install {
        color: #222;
        cursor: pointer;
    }

    .nav-sub a.nav-install:hover,
    .nav-sub a.nav-install:focus-visible {
        background: rgba(255, 0, 0, 0.06);
        color: #cc0000;
        outline: none;
    }

    .nav-sub .ext {
        margin-left: auto;
        color: #9a9082;
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
    }

    .nav-sub a:hover .ext {
        color: #cc0000;
    }

    /* ===== 尚未开放的功能：灰色、不可点击 ===== */
    .nav-links a.nav-disabled-link,
    .nav-links a.nav-disabled-link:hover {
        color: #a29b91;
        background: transparent;
        cursor: not-allowed;
    }

    .nav-links a.nav-disabled-link img,
    .nav-more.nav-disabled > details > summary img {
        filter: grayscale(1);
        opacity: 0.45;
    }

    .nav-more.nav-disabled > details > summary,
    .nav-more.nav-disabled > details > summary:hover {
        color: #a29b91 !important;
        background: transparent !important;
        cursor: not-allowed;
        opacity: 0.65;
    }

    .nav-more.nav-disabled > details > summary .caret {
        display: none;
    }

    .nav-sub .nav-sub-link.nav-disabled {
        color: #a29b91;
        cursor: not-allowed;
        opacity: 0.65;
    }

    .nav-sub .nav-sub-link.nav-disabled img {
        filter: grayscale(1);
        opacity: 0.45;
    }

    .nav-quick-btn:disabled,
    .nav-quick-btn:disabled:hover {
        color: #a29b91 !important;
        background: transparent !important;
        cursor: not-allowed;
        opacity: 0.55;
    }

    /* ===== “外观”下拉：两个状态切换键（目前只记录选择，不改变页面外观） ===== */
    .nav-sub .appearance-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 42px;
        padding: 10px 12px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #3d3934;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        text-align: left;
        white-space: nowrap;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-sub .appearance-toggle:hover,
    .nav-sub .appearance-toggle:focus-visible {
        background: rgba(255, 0, 0, 0.06);
        color: #cc0000;
        outline: none;
    }

    .nav-sub .appearance-toggle:active {
        background: rgba(255, 0, 0, 0.1);
    }

    /* 颜色模式仍锁定，只显示不可用状态 */
    .nav-sub .appearance-toggle:disabled,
    .nav-sub .appearance-toggle:disabled:hover,
    .nav-sub .appearance-toggle:disabled:active {
        background: transparent;
        color: #a29b91;
        cursor: not-allowed;
        opacity: 0.65;
    }

    .nav-sub .appearance-toggle:disabled .appearance-hint {
        color: #b5ada2;
    }

    .appearance-icon {
        display: block;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        transform-origin: center;
        transform-box: fill-box;
    }

    .appearance-label {
        display: inline-block;
    }

    .appearance-hint {
        margin-left: 0;
        color: #9a9082;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.4;
    }

    .appearance-font-serif {
        display: block;
    }

    .appearance-font-serif-right {
        stroke-width: 3.4;
    }

    .appearance-font-sans {
        display: none;
    }

    [data-appearance-toggle][data-value="sans"] .appearance-font-serif {
        display: none;
    }

    [data-appearance-toggle][data-value="sans"] .appearance-font-sans {
        display: block;
    }

    .appearance-nav-line {
        transition: transform 0.18s ease;
    }

    [data-appearance-toggle="nav"][data-value="bottom"] .appearance-nav-line {
        transform: translateY(8px);
    }

    .appearance-font-icon path {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
    }

    .appearance-toggle.is-switching .appearance-font-icon path,
    .nav-quick-btn.is-switching .appearance-font-icon path {
        animation: appearance-font-draw 0.44s ease both;
    }

    @keyframes appearance-font-draw {
        from {
            stroke-dashoffset: 1;
        }
        to {
            stroke-dashoffset: 0;
        }
    }

    .appearance-theme-moon {
        display: none;
    }

    .appearance-theme-moon path {
        fill: currentColor;
        stroke: none;
    }

    [data-appearance-toggle][data-value="dark"] .appearance-theme-sun {
        display: none;
    }

    [data-appearance-toggle][data-value="dark"] .appearance-theme-moon {
        display: block;
    }

    @keyframes appearance-icon-pop {
        0% {
            transform: rotate(0) scale(1);
        }
        45% {
            transform: rotate(-18deg) scale(0.82);
        }
        100% {
            transform: rotate(0) scale(1);
        }
    }

    .appearance-toggle.is-switching .appearance-icon,
    .nav-quick-btn.is-switching .appearance-icon {
        animation: appearance-icon-pop 0.36s ease;
    }

    .appearance-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    /* ===== 窄屏顶栏的外观快捷图标（不进入折叠菜单） ===== */
    .nav-quick-appearance {
        display: none;
        align-items: center;
        gap: 2px;
        margin-left: auto;
        flex-shrink: 0;
    }

    .nav-quick-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #3d3934;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.15s ease, color 0.15s ease;
    }

    .nav-quick-btn:hover,
    .nav-quick-btn:focus-visible {
        background: rgba(255, 0, 0, 0.07);
        color: #cc0000;
        outline: none;
    }

    .nav-quick-btn:active {
        background: rgba(255, 0, 0, 0.12);
    }

    .nav-quick-btn .appearance-icon {
        width: 19px;
        height: 19px;
    }

    .nav-quick-btn .appearance-font-icon {
        width: 19px;
        height: 19px;
    }

    .nav-appearance-trigger img {
        display: block;
        width: 20px;
        height: 20px;
        object-fit: contain;
        transition: filter 0.15s ease;
    }

    .nav-appearance-trigger:hover img,
    .nav-appearance-trigger:focus-visible img,
    .nav-appearance-trigger[aria-expanded="true"] img {
        filter: invert(27%) sepia(51%) saturate(2878%) hue-rotate(346deg) brightness(104%) contrast(97%);
    }

    .nav-appearance-trigger[aria-expanded="true"] {
        background: rgba(255, 0, 0, 0.07);
        color: #cc0000;
    }

    /* ===== 手机端外观面板 ===== */
    .mobile-appearance-menu {
        position: fixed;
        top: 64px;
        right: 10px;
        z-index: 1200;
        display: none;
        width: 200px;
        max-width: calc(100vw - 20px);
        padding: 6px;
        border: 1px solid #e2ddd2;
        border-radius: 6px;
        background: #fffefb;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.14);
    }

    .mobile-appearance-menu[hidden] {
        display: none !important;
    }

    html[data-nav-position="bottom"] .mobile-appearance-menu {
        top: auto;
        bottom: 64px;
    }

    .mobile-appearance-item {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        min-height: 42px;
        padding: 9px 12px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #3d3934;
        font-family: var(--sans);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        text-align: left;
        cursor: pointer;
    }

    .mobile-appearance-item .appearance-label {
        flex: 1;
        min-width: 0;
    }

    .mobile-appearance-item .appearance-hint {
        margin-left: auto;
        font-size: 14px;
    }

    .mobile-appearance-item:hover,
    .mobile-appearance-item:focus-visible {
        background: rgba(255, 0, 0, 0.06);
        color: #cc0000;
        outline: none;
    }

    .mobile-appearance-item:disabled,
    .mobile-appearance-item:disabled:hover {
        background: transparent;
        color: #a29b91;
        opacity: 0.65;
        cursor: not-allowed;
    }

    .mobile-appearance-item:disabled .appearance-hint {
        color: #b5ada2;
    }

    /* 蓝色主题入口：学习法律、新时代学习 */
    .nav-sub a.nav-xi,
    .nav-sub a.nav-law {
        color: #1a5fb4;
    }

    .nav-sub a.nav-xi .sub-icon {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        background-color: currentColor;
        -webkit-mask: url('/icons/顶栏/更多/新时代.svg?v=2') no-repeat center / contain;
        mask: url('/icons/顶栏/更多/新时代.svg?v=2') no-repeat center / contain;
        transition: background-color 0.15s ease;
    }

    .nav-sub a.nav-law .sub-icon {
        width: 18px;
        height: 18px;
        display: block;
        flex-shrink: 0;
        background-color: currentColor;
        -webkit-mask: url('/icons/顶栏/资源/法律.svg?v=1') no-repeat center / contain;
        mask: url('/icons/顶栏/资源/法律.svg?v=1') no-repeat center / contain;
        transition: background-color 0.15s ease;
    }

    .nav-sub a.nav-xi .ext {
        color: #1a5fb4;
        opacity: 0.75;
    }

    .nav-sub a.nav-xi:hover,
    .nav-sub a.nav-xi:focus-visible,
    .nav-sub a.nav-law:hover,
    .nav-sub a.nav-law:focus-visible {
        background: rgba(26, 95, 180, 0.1);
        color: #0b4f9e;
        outline: none;
    }

    .nav-sub a.nav-xi:hover .sub-icon,
    .nav-sub a.nav-xi:focus-visible .sub-icon,
    .nav-sub a.nav-law:hover .sub-icon,
    .nav-sub a.nav-law:focus-visible .sub-icon {
        background-color: #0b4f9e;
    }

    .nav-sub a.nav-xi:hover .ext,
    .nav-sub a.nav-xi:focus-visible .ext {
        color: #0b4f9e;
        opacity: 1;
    }

    /* ===== 全站回到顶部 ===== */
    .site-back-to-top {
        position: fixed;
        right: 28px;
        bottom: 28px;
        z-index: 900;
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 16px;
        border: 1px solid rgba(158, 20, 20, 0.2);
        border-radius: 999px;
        background: rgba(255, 254, 251, 0.95);
        color: #9e1414;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s, background 0.15s ease, color 0.15s ease;
    }

    .site-back-to-top.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
    }

    .site-back-to-top svg {
        display: block;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }

    @media (hover: hover) and (pointer: fine) {
        .site-back-to-top:hover {
            background: #9e1414;
            color: #fffaf2;
            border-color: #9e1414;
        }
    }

    @media (max-width: 960px) {
        .site-back-to-top {
            right: 16px;
            bottom: max(16px, env(safe-area-inset-bottom));
            width: 44px;
            height: 44px;
            min-height: 0;
            justify-content: center;
            padding: 0;
            border-radius: 50%;
        }

        .site-back-to-top span {
            display: none;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .site-back-to-top {
            transition: none;
        }

        html[data-nav-position="bottom"] .top-bar {
            animation: none;
        }

        .appearance-nav-line {
            transition: none;
        }
    }

    /* ===== 折叠按钮（移动端才显示） ===== */
    .nav-toggle,
