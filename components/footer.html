<style>
    /* ===== 全站页脚：所有页面底部统一显示 ===== */
    .site-footer {
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
        background: #211d1a;
        color: #d8cfc2;
        border-top: 3px solid #9e1414;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        -webkit-user-select: none;
        user-select: none;
    }

    .site-footer * {
        box-sizing: border-box;
    }

    .footer-inner {
        position: relative;
        z-index: 1;
        max-width: 1120px;
        margin: 0 auto;
        padding: 14px 2rem;
        text-align: center;
    }

    /* 页脚右侧的五位人物剪影：反相后做成低调的暖铜色线刻效果 */
    .footer-portrait {
        position: absolute;
        top: 50%;
        right: 2rem;
        width: clamp(160px, 18vw, 240px);
        height: auto;
        transform: translateY(-50%);
        opacity: 0.2;
        filter: invert(1) sepia(0.9) saturate(1.8) hue-rotate(340deg) brightness(0.95);
        pointer-events: none;
        user-select: none;
    }

    .footer-star {
        display: block;
        color: #d33a3a;
        font-size: 30px;
        line-height: 1;
        letter-spacing: 0;
    }

    .footer-slogan {
        margin: 8px 0 0;
        font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
        font-size: clamp(20px, 2.5vw, 25px);
        font-weight: 700;
        letter-spacing: 0.1em;
        line-height: 1.4;
        color: #f6efe4;
    }

    .footer-copy {
        width: 100%;
        max-width: 620px;
        margin: 12px auto 0;
        padding-top: 9px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 14px;
        line-height: 1.4;
        color: #7f7468;
    }

    /* 统计图片保持加载，但不参与布局、不占高度 */
    .librecounter {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 0;
        opacity: 0;
        pointer-events: none;
    }

    @media (max-width: 900px) {
        .footer-portrait {
            display: none;
        }
    }

    @media (max-width: 640px) {
        .footer-inner {
            padding: 12px 1.25rem;
        }

        .footer-star {
            font-size: 27px;
        }

        .footer-slogan {
            letter-spacing: 0.06em;
        }

        .footer-copy {
            margin-top: 10px;
            padding-top: 8px;
            font-size: 14px;
        }
    }
</style>

<footer class="site-footer">
    <div class="footer-inner">
        <span class="footer-star" aria-hidden="true">★</span>
        <p class="footer-slogan">全世界无产者，联合起来！</p>
        <p class="footer-copy">本站为公益学习网站，内容仅供学习研究使用</p>
    </div>

    <img
        class="footer-portrait"
        src="/pictures/%E9%A9%AC%E5%88%97%E6%81%A9%E6%96%AF%E6%AF%9B%E5%A4%B4%E5%83%8F.svg"
        alt=""
        aria-hidden="true"
        draggable="false"
    />

    <!-- LibreCounter 全站统计：隐藏计数，不进入其首页榜单。
         请勿添加 loading="lazy"，否则用户不滚动到页脚时不会被统计。 -->
    <img
        class="librecounter"
        src="https://librecounter.org/hidden.svg"
        referrerpolicy="unsafe-url"
        width="0"
        height="0"
        alt=""
        aria-hidden="true"
    />
</footer>
