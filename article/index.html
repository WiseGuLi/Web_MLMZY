<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-language" content="zh-CN" />
    <meta name="application-name" content="马列毛主义学习站" />
    <meta name="apple-mobile-web-app-title" content="马列毛主义学习站" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json?v=2" crossorigin="use-credentials" />
    <meta name="theme-color" content="#9e1414" />
    <link rel="apple-touch-icon" href="/icons/pwa/icon-192.png" />
    <title>文章 | GuLi 马列毛主义学习站</title>
    <meta name="description" content="GuLi 马列毛主义学习站文章栏目：按主题分类整理理论学习文章，供阅读与参考。" />
    <style>
        :root {
            --paper: #faf9f5;
            --ink: #1d1b19;
            --muted: #68625b;
            --red: #9e1414;
            --red-dark: #7c0d0d;
            --line: #e2ddd2;
            --card: #fffefb;
            --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        #nav-placeholder,
        #footer-placeholder {
            flex-shrink: 0;
        }

        .article-page {
            flex: 1;
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr);
            gap: clamp(2rem, 5vw, 4.5rem);
            align-items: start;
            width: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: clamp(44px, 6vw, 68px) 1.5rem clamp(56px, 8vw, 84px);
        }

        .article-page.sidebar-hidden {
            grid-template-columns: minmax(0, 1fr);
            gap: 0;
        }

        .article-page.sidebar-hidden .article-sidebar {
            display: none;
        }

        /* ----- 左侧分类栏 ----- */
        .article-sidebar {
            position: sticky;
            top: 96px;
        }

        .sidebar-title {
            font-family: var(--serif);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            line-height: 1.2;
        }

        .sidebar-title a {
            color: var(--ink);
            text-decoration: none;
        }

        .sidebar-title a:hover {
            color: var(--red);
        }

        .category-tabs {
            margin-top: 26px;
            border-top: 1px solid var(--line);
        }

        .category-tabs a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            color: #4b463f;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .category-tabs a::before {
            content: "";
            width: 3px;
            height: 15px;
            flex-shrink: 0;
            background: transparent;
        }

        .category-tabs a:hover {
            color: var(--red);
        }

        .category-tabs a.is-active {
            color: var(--red);
            font-weight: 600;
        }

        .category-tabs a.is-active::before {
            background: var(--red);
        }

        /* ----- 右侧正文区 ----- */
        .article-main {
            width: 100%;
            min-width: 0;
            max-width: var(--article-main-max, 760px);
        }

        .article-page.sidebar-hidden {
            --article-main-max: 900px;
        }

        .article-page.sidebar-hidden .article-main {
            margin-left: auto;
            margin-right: auto;
        }

        .article-toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .sidebar-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            min-height: 32px;
            padding: 3px 9px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--card);
            color: var(--muted);
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .sidebar-toggle:hover {
            color: var(--red);
            border-color: rgba(158, 20, 20, 0.4);
        }

        .sidebar-toggle:focus-visible {
            outline: 2px solid rgba(158, 20, 20, 0.3);
            outline-offset: 2px;
        }

        .sidebar-toggle svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .article-page.sidebar-hidden .article-body {
            max-width: 760px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 18px;
            padding: 2px 0;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .back-link:hover {
            color: var(--red);
        }

        .back-link[hidden] {
            display: none;
        }

        .back-link svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--red);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            line-height: 1.5;
        }

        .eyebrow::before {
            content: "";
            width: 24px;
            height: 2px;
            flex-shrink: 0;
            background: var(--red);
        }

        .home-intro h2 {
            font-family: var(--serif);
            font-size: clamp(27px, 3.2vw, 32px);
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        .home-intro p {
            margin-top: 14px;
            color: #3d3934;
            font-size: 17px;
            line-height: 1.95;
        }

        .home-intro p + p {
            margin-top: 10px;
        }

        .mobile-page-title {
            display: none;
        }

        .mobile-category-list {
            display: none;
        }

        .category-title {
            font-family: var(--serif);
            font-size: clamp(27px, 3.4vw, 33px);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.4;
        }

        .category-intro {
            max-width: 680px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.9;
        }

        .article-list {
            margin-top: 24px;
            border-top: 1px solid var(--line);
            list-style: none;
        }

        .article-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            padding: 17px 4px;
            border-bottom: 1px solid var(--line);
        }

        .article-row-title {
            font-family: var(--sans);
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.5;
            word-break: break-word;
        }

        .read-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            min-height: 36px;
            padding: 6px 16px;
            border: 1px solid var(--red);
            border-radius: 2px;
            background: var(--red);
            color: #fffaf2;
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .read-btn:hover {
            background: var(--red-dark);
            border-color: var(--red-dark);
        }

        .empty-note {
            padding: 26px 0;
            color: var(--muted);
            font-size: 15px;
        }

        .article-kicker {
            margin-bottom: 8px;
            color: var(--red);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .article-page-title {
            font-family: var(--serif);
            font-size: clamp(28px, 3.4vw, 34px);
            font-weight: 700;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        .article-body {
            max-width: 700px;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid var(--line);
        }

        .article-body p {
            color: #3d3934;
            font-family: var(--serif);
            font-size: 17px;
            line-height: 2;
        }

        .article-body p + p {
            margin-top: 14px;
        }

        /* ----- 文章标签 ----- */
        .article-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 13px;
        }

        .article-tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 9px;
            border: 1px solid rgba(158, 20, 20, 0.28);
            border-radius: 999px;
            background: rgba(158, 20, 20, 0.05);
            color: var(--red);
            font-family: var(--sans);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.7;
        }

        /* ----- Markdown 正文 ----- */
        .article-body h1,
        .article-body h2,
        .article-body h3,
        .article-body h4,
        .article-body h5,
        .article-body h6 {
            margin: 1.65em 0 0.65em;
            color: var(--ink);
            font-family: var(--serif);
            font-weight: 700;
            line-height: 1.55;
        }

        .article-body h1 {
            font-size: 1.65rem;
        }

        .article-body h2 {
            font-size: 1.42rem;
        }

        .article-body h3 {
            font-size: 1.22rem;
        }

        .article-body h4,
        .article-body h5,
        .article-body h6 {
            font-size: 1.06rem;
        }

        .article-body > :first-child {
            margin-top: 0;
        }

        .article-body ul,
        .article-body ol {
            margin: 14px 0 0;
            padding-left: 1.55em;
            color: #3d3934;
            font-family: var(--serif);
            font-size: 17px;
            line-height: 1.95;
        }

        .article-body li + li {
            margin-top: 5px;
        }

        .article-body blockquote {
            margin: 18px 0 0;
            padding: 12px 18px;
            border-left: 3px solid rgba(158, 20, 20, 0.45);
            background: rgba(158, 20, 20, 0.035);
            color: #5b544c;
        }

        .article-body blockquote p {
            margin: 0;
            font-size: 16px;
            line-height: 1.95;
        }

        .article-body hr {
            height: 1px;
            margin: 28px 0;
            border: 0;
            background: var(--line);
        }

        .article-body a {
            color: var(--red);
            text-decoration: none;
            border-bottom: 1px solid rgba(158, 20, 20, 0.3);
        }

        .article-body a:hover {
            color: var(--red-dark);
            border-bottom-color: var(--red-dark);
        }

        .article-body code {
            padding: 1px 5px;
            border-radius: 3px;
            background: #f2eee7;
            color: #6d2828;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.88em;
        }

        .article-body pre {
            margin: 18px 0 0;
            padding: 14px 16px;
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #faf7f1;
        }

        .article-body pre code {
            padding: 0;
            background: transparent;
            color: #3d3934;
            font-size: 14px;
            line-height: 1.7;
        }

        .article-body img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 20px auto 0;
            border-radius: 3px;
        }

        .markdown-table-wrap {
            width: 100%;
            margin-top: 18px;
            overflow-x: auto;
        }

        .article-body table {
            width: 100%;
            min-width: 460px;
            border-collapse: collapse;
            font-family: var(--serif);
            font-size: 16px;
            line-height: 1.7;
        }

        .article-body th,
        .article-body td {
            padding: 8px 10px;
            border: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        .article-body th {
            background: #f5f1e9;
            font-weight: 700;
        }

        .markdown-div-right {
            text-align: right;
        }

        .markdown-div-center {
            text-align: center;
        }

        .article-state {
            padding: 28px 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.9;
        }

        .article-state--error {
            color: #8a3a31;
        }

        .article-retry {
            margin-left: 8px;
            padding: 2px 9px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--card);
            color: var(--red);
            font-family: var(--sans);
            font-size: 14px;
            cursor: pointer;
        }

        .article-retry:hover {
            border-color: rgba(158, 20, 20, 0.4);
        }

        @media (max-width: 960px) {
            .article-page {
                display: block;
                padding: 36px 1.25rem 56px;
            }

            .article-sidebar {
                display: none;
            }

            .article-toolbar {
                display: none;
            }

            .article-main {
                max-width: none;
            }

            .mobile-page-title {
                display: block;
                margin-bottom: 18px;
                font-family: var(--serif);
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                line-height: 1.3;
            }

            .mobile-category-list {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 28px;
            }

            .mobile-category-list a {
                display: inline-flex;
                align-items: center;
                min-height: 38px;
                padding: 6px 16px;
                border: 1px solid var(--line);
                border-radius: 2px;
                background: var(--card);
                color: #4b463f;
                font-size: 15px;
                font-weight: 500;
                text-decoration: none;
                transition: color 0.15s ease, border-color 0.15s ease;
            }

            .mobile-category-list a:hover {
                color: var(--red);
                border-color: rgba(158, 20, 20, 0.4);
            }

            .category-title::before {
                content: "文章-";
            }

            .home-intro h2 {
                font-size: 27px;
            }

            .home-intro p {
                font-size: 16px;
            }

            .back-link {
                margin-bottom: 14px;
            }

            .category-title,
            .article-page-title {
                font-size: 28px;
            }

            .article-row {
                align-items: flex-start;
                gap: 12px;
                padding: 16px 0;
            }

            .article-row-title {
                font-size: 1.08rem;
            }

            .read-btn {
                min-height: 34px;
                padding: 5px 13px;
            }

            .article-body p {
                font-size: 16px;
                line-height: 1.95;
            }
        }
    </style>
</head>
<body>

    <!-- 顶栏占位 -->
    <div id="nav-placeholder"></div>

    <main class="article-page">
        <aside class="article-sidebar" id="articleSidebar" aria-label="文章分类">
            <h1 class="sidebar-title">
                <a href="/article" data-route="/article">文章</a>
            </h1>
            <nav class="category-tabs" id="categoryTabs" aria-label="文章分类"></nav>
        </aside>

        <section class="article-main" aria-label="文章内容">
            <div class="article-toolbar">
                <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-expanded="true" aria-controls="articleSidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="1"></rect>
                        <path d="M9 4v16"></path>
                    </svg>
                    <span class="sidebar-toggle-label">隐藏侧栏</span>
                </button>
            </div>
            <button class="back-link" id="backLink" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
                <span>返回</span>
            </button>
            <div id="articleView"></div>
        </section>
    </main>

    <!-- 页脚占位 -->
    <div id="footer-placeholder"></div>

    <script src="/article-page.js?v=1"></script>

    <!-- 加载外部顶栏与页脚 -->
    <script>
        fetch('/components/nav.html?v=27')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('顶栏加载失败:', err);
            });

        fetch('/components/footer.html?v=10')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('页脚加载失败:', err);
            });
    </script>

    <script src="/components/nav.js?v=17"></script>
</body>
</html>
