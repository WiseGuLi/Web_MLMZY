<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全空白页面</title>
    <style>
        /* 重置所有边距，保证页面完全空白 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;  /* 纯白背景，可改为您喜欢的底色 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶栏容器只负责占位，样式完全由 nav.html 决定 */
        #nav-placeholder {
            flex-shrink: 0;
        }

        /* 主体内容区域：完全空白，不显示任何内容 */
        .main-content {
            flex: 1;
            /* 不加任何内边距、边框、文字，保持全空 */
        }
    </style>
</head>
<body>

    <!-- 顶栏占位 -->
    <div id="nav-placeholder"></div>

    <!-- 主体：完全空白（不加任何文字或元素） -->
    <div class="main-content"></div>

    <!-- 加载外部顶栏 -->
    <script>
        fetch('/components/nav.html')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(err => {
                // 如果加载失败，可在此处给出备用提示（但为了“全空白”，此处留空）
                console.warn('顶栏加载失败:', err);
                // 您可以取消注释下一行来显示一个简单的备用提示（非必须）
                // document.getElementById('nav-placeholder').innerHTML = '<p style="padding:1rem;color:#999;">顶栏加载失败，请检查路径</p>';
            });
    </script>

</body>
</html>
