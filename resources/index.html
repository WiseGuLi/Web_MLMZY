    <style>
        * {
            margin: 0;
            padding: 0;

        body {
            background-color: #faf9f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;

        #nav-placeholder,
        #footer-placeholder {

    <div id="nav-placeholder"></div>

    <main class="main-content"></main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('/components/nav.html?v=43')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('顶栏加载失败:', err);
            });

        fetch('/components/footer.html?v=10')
            .then(res => {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(err => {
                console.warn('页脚加载失败:', err);
            });
    </script>

    <script src="/components/nav.js?v=21"></script>
