<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-language" content="zh-CN" />
    <meta name="application-name" content="马列毛主义学习站" />
    <meta name="apple-mobile-web-app-title" content="马列毛主义学习站" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>革命文艺 | 马列毛主义学习站</title>
    <link rel="manifest" href="/manifest.json?v=2" crossorigin="use-credentials" />
    <meta name="theme-color" content="#9e1414" />
    <link rel="apple-touch-icon" href="/icons/pwa/icon-192.png" />
    <style>
        :root {
            --paper: #faf9f5;
            --ink: #1d1b19;
            --muted: #68625b;
            --red: #9e1414;
            --red-dark: #7c0d0d;
            --line: #e2ddd2;
            --card: #fffefb;
            --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        #nav-placeholder,
        #footer-placeholder {
            flex-shrink: 0;
        }

        .art-page {
            flex: 1;
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: clamp(38px, 5vw, 64px) 1.5rem 80px;
        }

        .art-head {
            max-width: 760px;
            margin-bottom: 34px;
        }

        .art-kicker {
            color: var(--red);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            line-height: 1.5;
        }

        .art-title {
            margin-top: 6px;
            font-family: var(--serif);
            font-size: clamp(2.1rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1.3;
        }

        .art-intro {
            margin-top: 12px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.9;
        }

        .art-status {
            padding: 30px 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.8;
        }

        .art-status[hidden] {
            display: none;
        }

        .art-status--error {
            color: #8a3a31;
        }

        .art-sections {
            display: flex;
            flex-direction: column;
            gap: 42px;
        }

        .art-section-head {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }

        .art-section-title {
            font-family: var(--serif);
            font-size: 1.45rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .art-section-count {
            color: #8a8278;
            font-size: 14px;
        }

        .art-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .art-card {
            display: block;
            width: 100%;
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: var(--card);
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: zoom-in;
            transition: border-color 0.15s ease, transform 0.18s ease, box-shadow 0.18s ease;
        }

        .art-card:hover {
            border-color: #d4cbbc;
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(50, 43, 35, 0.08);
        }

        .art-card:focus-visible {
            outline: 2px solid rgba(158, 20, 20, 0.4);
            outline-offset: 2px;
        }

        .art-thumb {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: contain;
            background: #f0ebe2;
        }

        /* ----- 大图查看 ----- */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(16px, 4vw, 48px);
            background: rgba(20, 16, 14, 0.92);
        }

        .lightbox[hidden] {
            display: none;
        }

        .lightbox-figure {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 100%;
            max-height: 100%;
        }

        .lightbox-image {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 48px);
            object-fit: contain;
            background: #111;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .lightbox-close {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255, 250, 242, 0.38);
            border-radius: 50%;
            background: rgba(20, 16, 14, 0.55);
            color: #fffaf2;
            font-family: var(--sans);
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }

        .lightbox-close:hover {
            background: var(--red);
            border-color: var(--red);
        }

        body.lightbox-open {
            overflow: hidden;
        }

        @media (max-width: 600px) {
            .art-page {
                padding: 30px 1.25rem 60px;
            }

            .art-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .art-sections {
                gap: 34px;
            }

            .lightbox-image {
                max-height: calc(100vh - 150px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .art-card {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <main class="art-page">
        <header class="art-head">
            <p class="art-kicker">革命文艺</p>
            <h1 class="art-title">美术图片</h1>
            <p class="art-intro">收录革命美术作品，包括雕塑、绘画、年画与宣传画。点击图片可查看大图。</p>
        </header>

        <p class="art-status" id="artStatus" role="status">正在加载美术图片…</p>
        <div class="art-sections" id="artSections"></div>
    </main>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图" hidden>
        <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭大图">×</button>
        <figure class="lightbox-figure">
            <img class="lightbox-image" id="lightboxImage" alt="" />
        </figure>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        fetch('/components/nav.html?v=31')
            .then(function (res) {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(function (data) {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(function (err) {
                console.warn('顶栏加载失败:', err);
            });

        fetch('/components/footer.html?v=10')
            .then(function (res) {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(function (data) {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(function (err) {
                console.warn('页脚加载失败:', err);
            });
    </script>

    <script>
        (function () {
            'use strict';

            var ART_BASE = 'https://b2.mlmzy.org/';
            var CATEGORY_ORDER = ['雕塑', '绘画', '年画', '宣传画'];
            var MANIFEST_URL = '/data/革命文艺/美术图片.json';
            var API_URL = '/api/art-images';

            var status = document.getElementById('artStatus');
            var sections = document.getElementById('artSections');
            var lightbox = document.getElementById('lightbox');
            var lightboxImage = document.getElementById('lightboxImage');
            var lightboxClose = document.getElementById('lightboxClose');
            var lastFocus = null;

            function buildImageUrl(key) {
                return ART_BASE + String(key || '').split('/').map(encodeURIComponent).join('/');
            }

            function normalizeImages(payload) {
                var images = payload && Array.isArray(payload.images) ? payload.images : [];
                return images.filter(function (image) {
                    return image && image.category && image.key;
                });
            }

            function groupImages(images) {
                var groups = [];
                var byName = Object.create(null);

                images.forEach(function (image) {
                    var group = byName[image.category];
                    if (!group) {
                        group = { name: image.category, images: [] };
                        byName[image.category] = group;
                        groups.push(group);
                    }
                    group.images.push(image);
                });

                groups.sort(function (a, b) {
                    var ai = CATEGORY_ORDER.indexOf(a.name);
                    var bi = CATEGORY_ORDER.indexOf(b.name);
                    if (ai === -1) ai = CATEGORY_ORDER.length;
                    if (bi === -1) bi = CATEGORY_ORDER.length;
                    return ai - bi || a.name.localeCompare(b.name, 'zh-CN');
                });

                return groups;
            }

            function openLightbox(image) {
                lastFocus = document.activeElement;
                lightboxImage.src = buildImageUrl(image.key);
                lightboxImage.alt = image.category + '美术作品';
                lightbox.hidden = false;
                document.body.classList.add('lightbox-open');
                lightboxClose.focus();
            }

            function closeLightbox() {
                lightbox.hidden = true;
                lightboxImage.removeAttribute('src');
                document.body.classList.remove('lightbox-open');
                if (lastFocus && typeof lastFocus.focus === 'function') {
                    lastFocus.focus();
                }
            }

            function createCard(image) {
                var card = document.createElement('button');
                card.type = 'button';
                card.className = 'art-card';
                card.setAttribute('aria-label', '查看' + image.category + '美术作品大图');

                var img = document.createElement('img');
                img.className = 'art-thumb';
                img.src = buildImageUrl(image.key);
                img.alt = image.category + '美术作品';
                img.loading = 'lazy';
                img.decoding = 'async';

                card.appendChild(img);

                img.addEventListener('error', function () {
                    card.remove();
                });
                card.addEventListener('click', function () {
                    openLightbox(image);
                });

                return card;
            }

            function render(images) {
                var groups = groupImages(images);
                sections.innerHTML = '';

                if (!groups.length) {
                    status.hidden = false;
                    status.textContent = '美术图片正在整理中，敬请期待。';
                    return;
                }

                groups.forEach(function (group) {
                    var section = document.createElement('section');
                    section.className = 'art-section';

                    var head = document.createElement('div');
                    head.className = 'art-section-head';

                    var title = document.createElement('h2');
                    title.className = 'art-section-title';
                    title.textContent = group.name;

                    var count = document.createElement('span');
                    count.className = 'art-section-count';
                    count.textContent = group.images.length + ' 幅';

                    head.appendChild(title);
                    head.appendChild(count);

                    var grid = document.createElement('div');
                    grid.className = 'art-grid';
                    group.images.forEach(function (image) {
                        grid.appendChild(createCard(image));
                    });

                    section.appendChild(head);
                    section.appendChild(grid);
                    sections.appendChild(section);
                });

                status.hidden = true;
                status.textContent = '';
            }

            async function loadImages() {
                try {
                    var response = await fetch(API_URL, { cache: 'no-store' });
                    if (response.ok) {
                        var payload = await response.json();
                        var images = normalizeImages(payload);
                        if (images.length) {
                            render(images);
                            return;
                        }
                    }
                } catch (error) {
                    console.warn('R2 图片目录读取失败，使用静态清单:', error);
                }

                try {
                    var fallback = await fetch(MANIFEST_URL + '?t=' + Date.now(), { cache: 'no-store' });
                    if (!fallback.ok) throw new Error('HTTP ' + fallback.status);
                    var data = await fallback.json();
                    render(normalizeImages(data));
                } catch (error) {
                    console.warn('美术图片清单加载失败:', error);
                    status.hidden = false;
                    status.className = 'art-status art-status--error';
                    status.textContent = '美术图片加载失败，请尝试刷新网页。';
                }
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', function (event) {
                if (event.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && !lightbox.hidden) closeLightbox();
            });

            loadImages();
        })();
    </script>

    <script src="/components/nav.js?v=18"></script>
</body>
</html>
