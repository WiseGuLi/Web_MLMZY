<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-language" content="zh-CN" />
    <meta name="application-name" content="马列毛主义学习站" />
    <meta name="apple-mobile-web-app-title" content="马列毛主义学习站" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>革命文艺 | 马列毛主义学习站</title>
    <link rel="manifest" href="/manifest.json?v=2" crossorigin="use-credentials" />
    <meta name="theme-color" content="#9e1414" />
    <link rel="apple-touch-icon" href="/icons/pwa/icon-192.png" />
    <style>
        :root {
            --paper: #faf9f5;
            --ink: #1d1b19;
            --muted: #68625b;
            --red: #9e1414;
            --line: #e2ddd2;
            --card: #fffefb;
            --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
            --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        #nav-placeholder,
        #footer-placeholder {
            flex-shrink: 0;
        }

        .art-home {
            flex: 1;
            width: 100%;
            max-width: 1120px;
            margin: 0 auto;
            padding: clamp(38px, 5vw, 64px) 1.5rem 80px;
        }

        .art-kicker {
            color: var(--red);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.14em;
            line-height: 1.5;
        }

        .art-title {
            margin-top: 6px;
            font-family: var(--serif);
            font-size: clamp(2.1rem, 4vw, 2.8rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1.3;
        }

        .art-intro {
            max-width: 760px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.9;
        }

        .entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 34px;
        }

        .entry-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        a.entry-card:hover {
            transform: translateY(-2px);
            border-color: #d4cbbc;
            box-shadow: 0 8px 24px rgba(50, 43, 35, 0.08);
        }

        .entry-thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #f0ebe2;
        }

        .entry-thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .entry-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 13px 15px;
            border-top: 1px solid var(--line);
        }

        .entry-name {
            font-family: var(--serif);
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .entry-note {
            flex: 0 0 auto;
            color: #8a8278;
            font-size: 14px;
        }

        .entry-card.is-disabled {
            color: #68625b;
        }

        .entry-card.is-disabled .entry-thumb {
            background: #f4f0e8;
        }

        .entry-card.is-disabled .entry-name {
            color: #68625b;
        }

        @media (max-width: 560px) {
            .art-home {
                padding: 30px 1.25rem 60px;
            }

            .entry-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .entry-body {
                padding: 11px 12px;
            }

            .entry-name {
                font-size: 1rem;
            }

            .entry-note {
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .entry-card {
                transition: none;
            }
        }
    </style>
    <script src="/components/site-font.js?v=1"></script>
    <link rel="stylesheet" href="/components/site-font.css?v=1" />
</head>
<body>

    <div id="nav-placeholder"></div>

    <main class="art-home">
        <p class="art-kicker">革命文艺</p>
        <h1 class="art-title">革命文艺</h1>
        <p class="art-intro">革命文艺是革命事业的一部分。这里按门类整理美术、电影、舞蹈、戏剧与音乐等学习资源。</p>

        <div class="entry-grid">
            <a class="entry-card" href="/resources/revolutionary-art/painting/">
                <span class="entry-thumb"><img src="/icons/painting.webp" alt="" loading="lazy" onerror="this.remove()" /></span>
                <span class="entry-body">
                    <span class="entry-name">美术图片</span>
                    <span class="entry-note">进入 →</span>
                </span>
            </a>

            <div class="entry-card is-disabled" aria-disabled="true">
                <span class="entry-thumb"><img src="/resources/revolutionary-art/icons/movie.webp" alt="" loading="lazy" onerror="this.remove()" /></span>
                <span class="entry-body">
                    <span class="entry-name">电影</span>
                    <span class="entry-note">即将开放</span>
                </span>
            </div>

            <div class="entry-card is-disabled" aria-disabled="true">
                <span class="entry-thumb"><img src="/resources/revolutionary-art/icons/dance.webp" alt="" loading="lazy" onerror="this.remove()" /></span>
                <span class="entry-body">
                    <span class="entry-name">舞蹈</span>
                    <span class="entry-note">即将开放</span>
                </span>
            </div>

            <div class="entry-card is-disabled" aria-disabled="true">
                <span class="entry-thumb"><img src="/resources/revolutionary-art/icons/drama.webp" alt="" loading="lazy" onerror="this.remove()" /></span>
                <span class="entry-body">
                    <span class="entry-name">戏剧</span>
                    <span class="entry-note">即将开放</span>
                </span>
            </div>

            <div class="entry-card is-disabled" aria-disabled="true">
                <span class="entry-thumb"><img src="/resources/revolutionary-art/icons/music.webp" alt="" loading="lazy" onerror="this.remove()" /></span>
                <span class="entry-body">
                    <span class="entry-name">音乐</span>
                    <span class="entry-note">即将开放</span>
                </span>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('/components/nav.html?v=40')
            .then(function (res) {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(function (data) {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(function (err) {
                console.warn('顶栏加载失败:', err);
            });

        fetch('/components/footer.html?v=10')
            .then(function (res) {
                if (!res.ok) throw new Error('网络响应失败');
                return res.text();
            })
            .then(function (data) {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(function (err) {
                console.warn('页脚加载失败:', err);
            });

        Array.prototype.forEach.call(document.querySelectorAll('.entry-thumb img'), function (img) {
            img.addEventListener('error', function () {
                img.remove();
            });
        });
    </script>

    <script src="/components/nav.js?v=19"></script>
</body>
</html>
