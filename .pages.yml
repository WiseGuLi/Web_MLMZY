content:
  - name: books
    label: 文库管理
    type: collection
    path: data
    filename: books.yml
    list: true
    view:
      fields: [title, format, featured]
      primary: title
    fields:
      - name: title
        label: 书名
        type: string
        required: true

      - name: file
        label: 原始文件名（R2中的路径）
        type: string
        required: true
        description: "例如 csapp.pdf 或 pdfs/csapp.pdf，必须与 R2 桶中的实际路径完全一致"

      - name: format
        label: 文件格式（PDF or HTML）
        type: select
        required: true
        options:
          values:
            - label: PDF
              value: pdf
            - label: HTML
              value: html

      - name: featured
        label: 是否推荐
        type: boolean
        default: false

      - name: description
        label: 简介
        type: text